<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background-color: #f0f0f0;
        }

        #console {
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            min-height: 300px;
            overflow-y: auto;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .success {
            color: #4caf50;
        }

        .info {
            color: #569cd6;
        }

        .warn {
            color: #cca700;
        }

        .error {
            color: #f44336;
        }
    </style>
</head>

<body>
    <h1>Library Test</h1>
    <p>test will be executed on your browser</p>
    <button onclick="runTest()">(Run Test)</button>
    <br><br>
    <div id="console">Ready...</div>

    <script type="module">
        import { Opsec, Crc32 } from '../Opsec.js';
        const BencryptURL = 'https://cdn.jsdelivr.net/gh/k-atusa/USAG-Lib/Bencrypt/Bencrypt.js';
        const { AsymMaster, TestReader, TestWriter } = await import(BencryptURL);

        window.LibTest = {
            Opsec,
            Crc32,
            AsymMaster,
            TestReader,
            TestWriter
        };
    </script>

    <script>
        const consoleDiv = document.getElementById('console');
        function log(message, color = '') { // printer
            const span = document.createElement('span');
            span.textContent = message + "\n";
            if (color) span.style.color = color;
            consoleDiv.appendChild(span);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(message);
        }
        function formatBytes(u8) {
            if (u8.length > 100) return `[Uint8Array length=${u8.length}]`;
            try {
                return `${Array.from(u8).map(b => b.toString()).join(' ')}`;
            } catch (e) {
                return "[Error formatting bytes]";
            }
        }
    </script>

    <script>
        function fromBase64(str) {
            return Uint8Array.from(atob(str), c => c.charCodeAt(0));
        }

        async function runTest() {
            consoleDiv.innerHTML = "";
            log("--- Start Test ---", "blue");

            try {
                const { Opsec, Crc32, AsymMaster, TestReader, TestWriter } = window.LibTest;
                log(`CRC32 test: ${Crc32("test")}`); // 0c7e7fd8

                log("Generating Asym Keys... (This may take a moment)");
                const m_rsa1 = new AsymMaster("rsa1");
                const [pub0, pri0] = await m_rsa1.Genkey();
                const m_rsa2 = new AsymMaster("rsa2");
                const [pub1, pri1] = await m_rsa2.Genkey();
                const m_ecc1 = new AsymMaster("ecc1");
                const [pub2, pri2] = await m_ecc1.Genkey();
                const m = new Opsec();

                // 1. Stream (rw) Test
                log("\n[1] RW Stream Test");
                const w = new TestWriter();
                await w.write(new Uint8Array(128 * 4)); // b"\x00" * 128 * 4
                await m.Write(w, new TextEncoder().encode("Hello, world!"));

                const r = new TestReader(w.getValue());
                const readResult = await m.Read(r);
                log(`Result: ${new TextDecoder().decode(readResult)}`);

                // 2. SHA3 Test
                log("\n[2] SHA3 Test");
                m.Msg = "msg-test"; m.Smsg = "smsg-test"; m.Size = 1024; m.Name = "name-test"; m.BodyAlgo = "gcm1"; m.ContAlgo = "zip1";
                let enc = await m.Encpw("sha3", "password", "keyfile");
                m.View(enc);
                await m.Decpw("password", "keyfile");
                log(`${m.Msg} | ${m.Smsg} | ${m.Size} | ${m.Name} | ${m.BodyAlgo} | ${m.ContAlgo} | KeyLen:${m.BodyKey.length}`);
                m.Reset();

                // 3. PBKDF2 Test
                log("\n[3] PBKDF2 Test");
                m.Msg = "msg-test"; m.Smsg = "smsg-test"; m.Size = 1024; m.Name = "name-test"; m.BodyAlgo = "gcm1"; m.ContAlgo = "zip1";
                enc = await m.Encpw("pbk1", "password", "keyfile");
                m.View(enc);
                await m.Decpw("password", "keyfile");
                log(`${m.Msg} | ${m.Smsg} | ${m.Size} | ${m.Name} | ${m.BodyAlgo} | ${m.ContAlgo} | KeyLen:${m.BodyKey.length}`);
                m.Reset();

                // 4. Argon2 Test
                log("\n[4] Argon2 Test");
                m.Msg = "msg-test"; m.Smsg = "smsg-test";
                enc = await m.Encpw("arg1", "password");
                m.View(enc);
                await m.Decpw("password");
                log(`${m.Msg} | ${m.Smsg} | ${m.Size} | ${m.Name} | ${m.BodyAlgo} | ${m.ContAlgo} | KeyLen:${m.BodyKey.length}`);
                m.Reset();

                // 5. RSA1 Test
                log("\n[5] RSA1 Test");
                m.Msg = "msg-test"; m.Smsg = "smsg-test"; m.Size = 1024; m.Name = "name-test"; m.BodyAlgo = "gcm1"; m.ContAlgo = "zip1";
                enc = await m.Encpub("rsa1", pub0, pri0);
                m.View(enc);
                await m.Decpub(pri0, pub0);
                log(`${m.Msg} | ${m.Smsg} | ${m.Size} | ${m.Name} | ${m.BodyAlgo} | ${m.ContAlgo} | KeyLen:${m.BodyKey.length}`);
                m.Reset();

                // 6. RSA2 Test
                log("\n[6] RSA2 Test");
                m.Msg = "msg-test"; m.Smsg = "smsg-test"; m.Size = 1024; m.Name = "name-test"; m.BodyAlgo = "gcm1"; m.ContAlgo = "zip1";
                enc = await m.Encpub("rsa2", pub1, pri1);
                m.View(enc);
                await m.Decpub(pri1, pub1);
                log(`${m.Msg} | ${m.Smsg} | ${m.Size} | ${m.Name} | ${m.BodyAlgo} | ${m.ContAlgo} | KeyLen:${m.BodyKey.length}`);
                m.Reset();

                // 7. ECC Test
                log("\n[7] ECC1 Test");
                m.Msg = "msg-test"; m.Smsg = "smsg-test";
                enc = await m.Encpub("ecc1", pub2, pri2);
                m.View(enc);
                await m.Decpub(pri2, pub2);
                log(`${m.Msg} | ${m.Smsg} | ${m.Size} | ${m.Name} | ${m.BodyAlgo} | ${m.ContAlgo} | KeyLen:${m.BodyKey.length}`);
                m.Reset();

            } catch (e) {
                console.error(e);
                log(`ERROR: ${e.message}`, "red");
                log(e.stack, "gray");
            }
            log("--- End Test ---", "blue");
        }
    </script>
</body>

</html>
