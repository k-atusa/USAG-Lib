<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background-color: #f0f0f0;
        }

        #console {
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            min-height: 300px;
            overflow-y: auto;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .success {
            color: #4caf50;
        }

        .info {
            color: #569cd6;
        }

        .warn {
            color: #cca700;
        }

        .error {
            color: #f44336;
        }
    </style>
</head>

<body>
    <h1>Library Test</h1>
    <p>test will be executed on your browser</p>
    <button onclick="runTest()">(Run Test)</button>
    <br><br>
    <div id="console">Ready...</div>

    <script type="module">
        import { Opsec, Crc32, PadLen, PadFile } from '../Opsec.js';
        const BencryptURL = 'https://cdn.jsdelivr.net/gh/k-atusa/USAG-Lib/Bencrypt/Bencrypt.js';
        // load TestReader, TestWriter from Bencrypt.js
        const { AsymMaster, TestReader, TestWriter, Random } = await import(BencryptURL);

        window.LibTest = {
            Opsec,
            Crc32,
            PadLen,
            PadFile,
            AsymMaster,
            TestReader,
            TestWriter,
            Random,
        };
    </script>

    <script>
        const consoleDiv = document.getElementById('console');
        function log(message, color = '') { // printer
            const span = document.createElement('span');
            span.textContent = message + "\n";
            if (color) span.style.color = color;
            consoleDiv.appendChild(span);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(message);
        }

        // Helper: Uint8Array comparison
        function bytesEqual(a, b) {
            if (a.length !== b.length) return false;
            for (let i = 0; i < a.length; i++) {
                if (a[i] !== b[i]) return false;
            }
            return true;
        }
    </script>

    <script>
        async function runTest() {
            consoleDiv.innerHTML = "";
            log("--- Start Test ---", "info");

            try {
                const { Opsec, Crc32, PadLen, PadFile, AsymMaster, TestReader, TestWriter, Random } = window.LibTest;

                // CRC32, RW Test
                log(`CRC32 test: ${Crc32("test")}`); // 0c7e7fd8

                const w = new TestWriter();
                await w.write(new Uint8Array(128 * 4)); // b"\x00" * 128 * 4
                const m = new Opsec();
                await m.Write(w, new TextEncoder().encode("Hello, world!"));

                const r = new TestReader(w.getValue());
                const readResult = await m.Read(r);
                log(`Read test: ${new TextDecoder().decode(readResult)}\n`);

                // Pad Test
                const Sizes = [0, 1024, 12 * 1048576, 123456789, 2147483647, 8 * 1073741824];
                for (const size of Sizes) {
                    log(`${size} ${PadLen(size) + size}`);
                    if (size < 512 * 1048576) {
                        const f = new TestWriter();
                        await PadFile(f, size);
                        log(f.getValue().length === size);
                    }
                }

                // test parameters
                const msg = "msg-test";
                const smsg = "smsg-test";
                const sinf = new TextEncoder().encode("sinf-test");
                const bodyalgo = "gcmx1";
                const bodysize = 1048576;
                const bodyinfo = new TextEncoder().encode("binf-test");

                // pw-mode
                log("--- pw-mode tests ---", "warn");
                const methodsPw = ["sha3", "pbk2", "arg2"];
                for (const method of methodsPw) {
                    m.Reset();
                    m.Msg = msg; m.Smsg = smsg; m.SmsgInfo = sinf;
                    m.BodyAlgo = bodyalgo; m.BodySize = bodysize; m.BodyInfo = bodyinfo;

                    const enc = await m.Encpw(method, "password", "keyfile");
                    const bodykey = m.BodyKey; // get generated BodyKey

                    m.View(enc);
                    await m.Decpw("password", "keyfile");

                    log(method);
                    const checks = [
                        msg === m.Msg,
                        smsg === m.Smsg,
                        bytesEqual(sinf, m.SmsgInfo),
                        bodyalgo === m.BodyAlgo,
                        bodysize === m.BodySize,
                        bytesEqual(bodyinfo, m.BodyInfo),
                        bytesEqual(bodykey, m.BodyKey)
                    ];

                    const resultRow = checks.map(c => c ? "OK" : "FAIL").join(" ");
                    const allPass = checks.every(c => c);
                    log(resultRow, allPass ? "success" : "error");
                }

                // pub-mode (from peer to me)
                log("\n--- pub-mode tests ---", "warn");
                const methodsPub = ["rsa1", "rsa2", "ecc1", "pqc1"];
                for (const method of methodsPub) {
                    log(`Generating keys for ${method}...`);
                    const me = new AsymMaster(method);
                    const [myPub, myPri] = await me.Genkey();
                    const peer = new AsymMaster(method);
                    const [peerPub, peerPri] = await peer.Genkey();

                    m.Reset();
                    m.Msg = msg; m.Smsg = smsg; m.SmsgInfo = sinf;
                    m.BodyAlgo = bodyalgo; m.BodySize = bodysize; m.BodyInfo = bodyinfo;

                    // Encrypt for 'me' (myPub), signed by 'peer' (peerPri)
                    const enc = await m.Encpub(method, myPub, peerPri);
                    const bodykey = m.BodyKey; // get generated BodyKey

                    m.View(enc);
                    // Decrypt using 'me' (myPri), verifying using 'peer' (peerPub)
                    await m.Decpub(myPri, myPub, peerPub);

                    log(method);
                    const checks = [
                        msg === m.Msg,
                        smsg === m.Smsg,
                        bytesEqual(sinf, m.SmsgInfo),
                        bodyalgo === m.BodyAlgo,
                        bodysize === m.BodySize,
                        bytesEqual(bodyinfo, m.BodyInfo),
                        bytesEqual(bodykey, m.BodyKey)
                    ];

                    const resultRow = checks.map(c => c ? "OK" : "FAIL").join(" ");
                    const allPass = checks.every(c => c);
                    log(resultRow, allPass ? "success" : "error");
                }

            } catch (e) {
                console.error(e);
                log(`ERROR: ${e.message}`, "error");
                log(e.stack, "error");
            }
            log("\n--- End Test ---", "info");
        }
    </script>
</body>

</html>
