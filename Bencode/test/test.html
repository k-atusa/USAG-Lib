<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background-color: #f0f0f0; }
        #console { 
            background-color: #1e1e1e; 
            color: #d4d4d4; 
            padding: 15px; 
            border-radius: 5px; 
            white-space: pre-wrap; 
            min-height: 300px;
            overflow-y: auto;
        }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        .success { color: #4caf50; }
        .info { color: #569cd6; }
    </style>
</head>
<body>
    <h1>Library Test</h1>
    <p>test will be executed on your browser</p>
    <button onclick="runTest()">(Run Test)</button>
    <br><br>
    <div id="console">Ready...</div>

    <script type="module">
        import {Encode64, Decode64, NormPW} from '../Bencode.js';
        window.Bencode = {
            "Encode64": Encode64,
            "Decode64": Decode64,
            "NormPW": NormPW
        }
    </script>

    <script>
        const consoleDiv = document.getElementById('console');
        function log(message, color = '') { // printer
            const span = document.createElement('span');
            span.textContent = message + "\n";
            if (color) span.style.color = color;
            consoleDiv.appendChild(span);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(message);
        }
        function formatBytes(u8) { // array to hex string
            if (u8.length > 20) return `[Uint8Array length=${u8.length}]`;
            return `b"${Array.from(u8).map(b => '\\x' + b.toString(16).padStart(2, '0')).join('')}"`;
        }
    </script>

    <script>
        async function runTest() {
            consoleDiv.innerHTML = "";
            log("--- Start Test ---", "blue");
            const decoder = new TextDecoder();

            try {
                const data = ["", "abc", "라이브러리 테스트 코드입니다.", "ABCD".repeat(64)];
                for (const i of data) {
                    let en = Bencode.Encode64(i);
                    let de = Bencode.Decode64(en);
                    log(en);
                    log(i === decoder.decode(de));

                    en = Bencode.Encode64(i, "#", 8, 3);
                    de = Bencode.Decode64(en, "#");
                    log(en);
                    log(i === decoder.decode(de));
                }
                log(formatBytes(Bencode.NormPW("한글 테스트")))

            } catch (e) {
                console.error(e);
                log(`ERROR: ${e.message}`, "red");
                log(e.stack, "gray");
            }
            log("--- End Test ---", "blue");
        }
    </script>
</body>
</html>
