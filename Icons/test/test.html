<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <style>
        .image-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 20px;
        }
        .image-item {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .image-item img {
            max-width: 200px;
            height: auto;
            display: block;
            margin-bottom: 10px;
        }
        h1 { text-align: center; }
    </style>
</head>
<body>
    <h1>Library Test</h1>
    <div class="image-container" id="container"></div>

    <script type="module">
        import {Icons} from '../Icons.js';
        window.Icons = Icons;
        const container = document.getElementById('container');
        const images = [
            { Name: 'ZipPng', mime: 'image/png' },
            { Name: 'ZipWebp', mime: 'image/webp' },
            { Name: 'AesPng', mime: 'image/png' },
            { Name: 'AesWebp', mime: 'image/webp' },
            { Name: 'CloudPng', mime: 'image/png' },
            { Name: 'CloudWebp', mime: 'image/webp' }
        ];

        images.forEach(item => {
            try {
                const imageData = window.Icons[item.Name];
                const blob = new Blob([imageData], { type: item.mime });
                const url = URL.createObjectURL(blob);

                const div = document.createElement('div');
                div.className = 'image-item';
                const img = document.createElement('img');
                img.src = url;
                img.alt = item.Name;

                const caption = document.createElement('p');
                caption.textContent = `Name: ${item.Name}`;

                div.appendChild(img);
                div.appendChild(caption);
                container.appendChild(div);

                console.log(`${item.Name} load success`);

            } catch (error) {
                console.error(`${item.Name} load fail:`, error);
                const div = document.createElement('div');
                div.className = 'image-item';
                div.innerHTML = `<p style="color: red;">Load Fail: ${item.Name}</p>`;
                container.appendChild(div);
            }
        });
    </script>
</body>
</html>
