<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background-color: #f0f0f0; }
        #console { 
            background-color: #1e1e1e; 
            color: #d4d4d4; 
            padding: 15px; 
            border-radius: 5px; 
            white-space: pre-wrap; 
            min-height: 300px;
            overflow-y: auto;
        }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        .success { color: #4caf50; }
        .info { color: #569cd6; }
        .warn { color: #cca700; }
        .error { color: #f44336; }
    </style>
</head>
<body>
    <h1>Library Test</h1>
    <p>test will be executed on your browser</p>
    <button onclick="runTest()">(Run Test)</button>
    <br><br>
    <div id="console">Ready...</div>

    <script type="module">
        import {TarWriter, TarReader} from '../Star.js';
        window.Star = {
            "TarWriter": TarWriter,
            "TarReader": TarReader
        }
    </script>

    <script>
        const consoleDiv = document.getElementById('console');
        function log(message, color = '') { // printer
            const span = document.createElement('span');
            span.textContent = message + "\n";
            if (color) span.style.color = color;
            consoleDiv.appendChild(span);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(message);
        }
        function formatBytes(u8) { // array to hex string
            if (u8.length > 20) return `[Uint8Array length=${u8.length}]`;
            return `b"${Array.from(u8).map(b => '\\x' + b.toString(16).padStart(2, '0')).join('')}"`;
        }
    </script>

    <script>
        async function runTest() {
            consoleDiv.innerHTML = "";
            log("--- Start Test ---", "blue");
            try {
                // Prepare Dummy Data
                const dummySize = 1024 * 1024 * 10; 
                const dummyData = new Uint8Array(dummySize); 
                const dummyBlob = new Blob([dummyData]);
                log(`[Setup] Created dummy data (${dummySize} bytes)`, "");

                // test TarWriter
                const tw = new window.Star.TarWriter("");
                await tw.Write("test/", null, true); // write "test/"
                const longName = "test/" + "가".repeat(100) + "파일.bin";
                await tw.Write(longName, dummyBlob, false); // write long name
                await tw.Write("이진 데이터", new TextEncoder().encode("Hello, world!"), false); // write binary

                // Close and Get Data
                const tarResult = await tw.Close();
                log(`[Success] Tar generated. Total size: ${tarResult.length} bytes`, "");

                // test TarReader
                const tr = new window.Star.TarReader(tarResult);
                await tr.Init();
                for (let i = 0; i < tr.Files.length; i++) {
                    const f = tr.Files[i];
                    log(` [File ${i}] Name: ${f.Name}, Size: ${f.Size}, Offset: ${f.Offset}, IsDir: ${f.IsDir}`, "");
                }
                log(`binary: ${formatBytes(tr.Read(2))}`, ""); // read binary
                tr.Close();

                // DOWNLOAD
                log("\nDownloading result as 'test.tar'...", "");
                tw._browserDownload(tarResult, "test.tar");

            } catch (e) {
                console.error(e);
                log(`ERROR: ${e.message}`, "red");
                log(e.stack, "gray");
            }
            log("--- End Test ---", "blue");
        }
    </script>
</body>
</html>
