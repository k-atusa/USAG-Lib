<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bencrypt Benchmark</title>
    
    <script src="https://cdn.jsdelivr.net/npm/js-sha3@0.9.3/src/sha3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js"></script>
    <script type="module">import {x448, ed448} from 'https://esm.sh/@noble/curves@1.4.0/ed448';window.noble = {x448, ed448};</script>
    
    <style>
        body { font-family: monospace; padding: 20px; background-color: #121212; color: #e0e0e0; }
        #console { 
            background-color: #1e1e1e; 
            color: #d4d4d4; 
            padding: 15px; 
            border: 1px solid #333;
            border-radius: 5px; 
            white-space: pre-wrap; 
            min-height: 500px;
            font-size: 14px;
            overflow-y: auto;
        }
        button { 
            padding: 10px 20px; 
            font-size: 16px; 
            cursor: pointer; 
            background-color: #007acc; 
            color: white; 
            border: none; 
            border-radius: 4px; 
        }
        button:hover { background-color: #005f9e; }
        button:disabled { background-color: #444; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>Bencrypt Benchmarks (Browser)</h1>
    <button id="btnRun" onclick="runBenchmark()">Run Benchmark</button>
    <br><br>
    <div id="console">Click 'Run Benchmark' to start...</div>

    <script type="module">
        import {
            Random, SHA3256, SHA3512, HashMaster, SymMaster, AsymMaster
        } from '../Bencrypt.js';
        
        window.Bencrypt = {
            Random, SHA3256, SHA3512, HashMaster, SymMaster, AsymMaster
        };
    </script>

    <script>
        const consoleDiv = document.getElementById('console');
        
        function log(msg) {
            consoleDiv.textContent += msg + "\n";
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(msg);
        }

        function fmt_speed(sizeBytes, durationMs) {
            const mb = sizeBytes / (1024 * 1024);
            const speed = mb / (durationMs / 1000);
            return `${speed.toFixed(2)} MiB/s`;
        }

        function fmt_time(count, durationMs) {
            const avgMs = durationMs / count;
            return `${avgMs.toFixed(2)} ms/op`;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function runBenchmark() {
            const btn = document.getElementById('btnRun');
            btn.disabled = true;
            consoleDiv.textContent = "";

            try {
                if (!window.Bencrypt) throw new Error("Bencrypt module is not loaded yet.");

                log("Bencrypt Benchmarks (JS/Browser)");
                await sleep(100);

                // ===== 1. Basic Functions =====
                log("\n===== Basic Functions =====");
                const p = [100 * 1048576, 100 * 1048576, 100 * 1048576]; // 100 MiB
                
                let start = performance.now();
                for (let i = 0; i < p[0] / 32768; i++) {
                    window.Bencrypt.Random(32768); // 32 KiB limit
                }
                let end = performance.now();
                log(`RandGen: ${fmt_speed(p[0], end - start)}`);
                await sleep(50);

                let data = new Uint8Array(p[1]);
                start = performance.now();
                window.Bencrypt.SHA3256(data);
                end = performance.now();
                log(`SHA3256: ${fmt_speed(p[1], end - start)}`);
                await sleep(50);

                data = new Uint8Array(p[2]);
                start = performance.now();
                window.Bencrypt.SHA3512(data);
                end = performance.now();
                log(`SHA3512: ${fmt_speed(p[2], end - start)}`);
                await sleep(50);

                // ===== 2. Hash Functions =====
                log("\n===== Hash Functions =====");
                const algos_h = ["sha3", "arg2low", "arg2st"];
                const iters_h = [100000, 5, 5];
                const pw = new Uint8Array(64);
                const salt = new Uint8Array(32);

                for (let i = 0; i < algos_h.length; i++) {
                    let w = new window.Bencrypt.HashMaster(algos_h[i]);
                    start = performance.now();
                    for (let j = 0; j < iters_h[i]; j++) {
                        await w.KDF(pw, salt);
                    }
                    end = performance.now();
                    log(`${algos_h[i]}: ${fmt_time(iters_h[i], end - start)}`);
                    await sleep(50);
                }

                // ===== 3. Symmetric Functions =====
                log("\n===== Symmetric Functions =====");
                const symSize = 512 * 1048576; // 512 MiB
                let symData;
                try {
                    symData = new Uint8Array(symSize);
                } catch (e) {
                    log(`[Warning] Failed to allocate 512MB for AES test. Skipping Symmetric benchmark. (${e.message})`);
                    symData = null;
                }

                if (symData) {
                    const algos_s = ["gcm1", "gcmx1"];
                    const key = new Uint8Array(32).fill(0); // 32B Null Key

                    for (let algo of algos_s) {
                        let w = new window.Bencrypt.SymMaster(algo, key);
                        start = performance.now();
                        await w.EnBin(symData);
                        end = performance.now();
                        log(`${algo} (in-memory): ${fmt_speed(symSize, end - start)}`);
                        // no File IO test
                        await sleep(50);
                    }
                }

                // ===== 4. Asymmetric Functions =====
                log("\n===== Asymmetric Functions =====");
                const algos_a = ["ecc1", "pqc1"];
                const iters_g = [20, 20];
                const iters_c = [50, 50];
                const asymData = new Uint8Array(64); // std: 64B data

                for (let i = 0; i < algos_a.length; i++) {
                    let w = new window.Bencrypt.AsymMaster(algos_a[i]);
                    
                    // GenKey Test
                    start = performance.now();
                    for (let j = 0; j < iters_g[i]; j++) {
                        await w.Genkey();
                    }
                    end = performance.now();
                    log(`${algos_a[i]} (genkey): ${fmt_time(iters_g[i], end - start)}`);
                    await sleep(10);

                    // Encrypt Test
                    start = performance.now();
                    for (let j = 0; j < iters_c[i]; j++) {
                        await w.Encrypt(asymData);
                    }
                    end = performance.now();
                    log(`${algos_a[i]} (encrypt): ${fmt_time(iters_c[i], end - start)}`);
                    await sleep(10);

                    // Sign Test
                    start = performance.now();
                    for (let j = 0; j < iters_c[i]; j++) {
                        await w.Sign(asymData);
                    }
                    end = performance.now();
                    log(`${algos_a[i]} (sign): ${fmt_time(iters_c[i], end - start)}`);
                    log(""); // Empty line separation
                    await sleep(10);
                }

                log("\nBenchmark Finished.");

            } catch (error) {
                log(`\nERROR: ${error.message}`);
                console.error(error);
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
