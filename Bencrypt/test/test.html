<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background-color: #f0f0f0;
        }

        #console {
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            min-height: 400px;
            max-height: 700px;
            overflow-y: auto;
            word-break: break-all;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .success {
            color: #4caf50;
        }

        .info {
            color: #569cd6;
        }

        .error {
            color: #f44336;
        }
    </style>
</head>

<body>
    <h1>Library Test</h1>
    <p>test will be executed on your browser</p>
    <button onclick="runTest()">(Run Test)</button>
    <br><br>
    <div id="console">Ready...</div>

    <script type="module">
        import {
            TestReader, TestWriter, Random, SHA3256, SHA3512, Masker, HashMaster, SymMaster, AsymMaster
        } from '../Bencrypt.js';

        window.Bencrypt = {
            "TestReader": TestReader,
            "TestWriter": TestWriter,
            "Random": Random,
            "SHA3256": SHA3256,
            "SHA3512": SHA3512,
            "Masker": Masker,
            "HashMaster": HashMaster,
            "SymMaster": SymMaster,
            "AsymMaster": AsymMaster
        }
    </script>

    <script>
        const consoleDiv = document.getElementById('console');

        function log(message, color = '') {
            const span = document.createElement('span');
            span.textContent = message + "\n";
            if (color) span.className = color;
            consoleDiv.appendChild(span);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(message);
        }

        function fromBase64(str) {
            const binStr = atob(str);
            const bytes = new Uint8Array(binStr.length);
            for (let i = 0; i < binStr.length; i++) {
                bytes[i] = binStr.charCodeAt(i);
            }
            return bytes;
        }

        function toBase64(bytes) {
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        function areEqual(buf1, buf2) {
            if (!buf1 || !buf2 || buf1.byteLength !== buf2.byteLength) return false;
            const dv1 = new Int8Array(buf1);
            const dv2 = new Int8Array(buf2);
            for (let i = 0; i !== buf1.byteLength; i++) {
                if (dv1[i] !== dv2[i]) return false;
            }
            return true;
        }

        function printPyBool(val) {
            return val ? "True" : "False";
        }
    </script>

    <script>
        async function runTest() {
            consoleDiv.innerHTML = "";
            try {
                // Wait for Module to Load completely
                if (!window.Bencrypt) throw new Error("Bencrypt module is not loaded yet. Wait a second.");

                // Load testsheet.txt (Assuming HTTP Server context)
                log("loading testsheet...", "info");
                const response = await fetch('testsheet.txt');
                if (!response.ok) throw new Error("Failed to load testsheet.txt. Make sure you are running via local HTTP server.");

                const text = await response.text();
                const sheet = [];
                const lines = text.split(/\r?\n/);
                for (let line of lines) {
                    if (line.trim().length > 0) sheet.push(fromBase64(line));
                }
                let pos = 0;
                log("testsheet loaded. \n", "success");

                // --- 1. Basic function test ---
                log("testing basic functions...");
                const data = new TextEncoder().encode("0000");
                log(toBase64(window.Bencrypt.Random(16)));
                log(toBase64(window.Bencrypt.SHA3256(data))); // pq9wt68/QjUteD6LB1FeQzw9RWadTv7mcFFnJxk7KRs=
                log(toBase64(window.Bencrypt.SHA3512(data))); // tnjOmGIvYntbNcoej2VvG9M1RdJCtZ8BWjHek4r6OvvmhThbjjzJ/zfYwq+G7r/TGe7WWr20vkGBzULuTzcPYQ==

                // --- 2. Masker Test ---
                log("\ntesting Masker...");
                const mA = new window.Bencrypt.Masker();
                const mB = new window.Bencrypt.Masker();
                const maskedZero = mA.XOR(new Uint8Array([0, 0, 0, 0]));
                log(Array.from(maskedZero).map(b => b.toString(16).padStart(2, '0')).join(''));
                let keyToMask = window.Bencrypt.Random(8753);
                let isReversible = areEqual(mB.XOR(mA.XOR(keyToMask)), keyToMask);
                log(printPyBool(isReversible));
                keyToMask = window.Bencrypt.Random(16384);
                isReversible = areEqual(mB.XOR(mA.XOR(keyToMask)), keyToMask);
                log(printPyBool(isReversible));

                // --- 3. HashMaster (pw_store, keygen) ---
                log("\ntesting HashMaster...");
                const hashm = ["sha3", "arg2low", "arg2st"];
                const pw = new TextEncoder().encode("ABCDABCDABCDABCD");
                const salt = new TextEncoder().encode("1234123412341234");

                for (let algo of hashm) {
                    const w = new window.Bencrypt.HashMaster(algo);
                    const [pwst, keygen] = await w.KDF(pw, salt);
                    log(printPyBool(areEqual(sheet[pos], pwst)));
                    pos += 1;
                    log(printPyBool(areEqual(sheet[pos], keygen)));
                    pos += 1;
                }

                // --- 4. SymMaster (enbin, enfile) ---
                log("\ntesting SymMaster...");
                const symm = ["gcm1", "gcmx1"];
                const key = new TextEncoder().encode("0".repeat(32));
                const plain = new TextEncoder().encode("Hello, world!".repeat(32));

                for (let algo of symm) {
                    const w = new window.Bencrypt.SymMaster(algo, key);

                    // DeBin Memory Test
                    let debinRes = await w.DeBin(sheet[pos]);
                    log(printPyBool(areEqual(plain, debinRes)));
                    pos += 1;

                    // DeFile Stream Test
                    let tr = new window.Bencrypt.TestReader(sheet[pos]);
                    let tw = new window.Bencrypt.TestWriter();
                    await w.DeFile(tr, sheet[pos].length, tw);
                    log(printPyBool(areEqual(plain, tw.getValue())));
                    pos += 1;

                    // 10MB Big data test
                    const bigdata = new Uint8Array(10000000); // 10MB
                    let bigenc = await w.EnBin(bigdata);
                    let bigdec = await w.DeBin(bigenc);
                    log(printPyBool(areEqual(bigdata, bigdec)));

                    let trBig = new window.Bencrypt.TestReader(bigdata);
                    let twBig = new window.Bencrypt.TestWriter();
                    await w.EnFile(trBig, bigdata.length, twBig);
                    let bigencFile = twBig.getValue();

                    let trBig2 = new window.Bencrypt.TestReader(bigencFile);
                    let twBig2 = new window.Bencrypt.TestWriter();
                    await w.DeFile(trBig2, bigencFile.length, twBig2);
                    log(printPyBool(areEqual(bigdata, twBig2.getValue())));
                }

                // --- 5. AsymMaster (pubkey, prikey, enc, sign) ---
                log("\ntesting AsymMaster...");
                const asymm = ["ecc1", "pqc1"];
                const plainAsym = new TextEncoder().encode("Hello, world!");

                for (let algo of asymm) {
                    const w = new window.Bencrypt.AsymMaster(algo);
                    let pub = sheet[pos];
                    let pri = sheet[pos + 1];
                    pos += 2;
                    await w.Loadkey(pub, pri);

                    let enc = sheet[pos];
                    let sign = sheet[pos + 1];
                    pos += 2;

                    // Decrypt and Verify compatibility with Python generated cipher/signature
                    let dec = await w.Decrypt(enc);
                    log(printPyBool(areEqual(plainAsym, dec)));

                    let ver = await w.Verify(plainAsym, sign);
                    log(printPyBool(ver));

                    // Internal Generate, Encrypt, Sign loop
                    const temp = new window.Bencrypt.AsymMaster(algo);
                    const [pub_new, pri_new] = await temp.Genkey();

                    const a = new window.Bencrypt.AsymMaster(algo);
                    const b = new window.Bencrypt.AsymMaster(algo);
                    await a.Loadkey(pub_new, null);
                    await b.Loadkey(null, pri_new);

                    let enc_new = await a.Encrypt(plainAsym);
                    let sign_new = await b.Sign(plainAsym);

                    let dec_new = await b.Decrypt(enc_new);
                    log(printPyBool(areEqual(plainAsym, dec_new)));

                    let ver_new = await a.Verify(plainAsym, sign_new);
                    log(printPyBool(ver_new));
                }

                log("\n--- All tests executed successfully ---", "success");

            } catch (e) {
                console.error(e);
                log(`\nERROR: ${e.message}`, "error");
                log(e.stack, "error");
            }
        }
    </script>
</body>

</html>
